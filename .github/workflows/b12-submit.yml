name: Application CI Exercise

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Submit application payload
        run: python submit.py
        env:
          ACTION_RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY_LINK: https://github.com/${{ github.repository }}
          RESUME_LINK: https://www.linkedin.com/in/sonal-shreya-4775867a/
